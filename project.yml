name: Skillet
options:
  bundleIdPrefix: com.mcsoftware
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 382G4857JD
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Skillet:
    type: application
    platform: macOS
    sources:
      - Skillet
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
    info:
      path: Skillet/Info.plist
      properties:
        # Sparkle auto-updates: the feed lives on main, archives on Releases.
        SUFeedURL: https://raw.githubusercontent.com/mcomisso/skillet/main/appcast.xml
        SUPublicEDKey: LkzYDuFKQt33OK+FZcTZXOTRf9eW/ZGhMSKAM7q1Vug=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcsoftware.Skillet
        PRODUCT_NAME: Skillet
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 MC Software. MIT License."
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

  SkilletTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SkilletTests
    dependencies:
      - target: Skillet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcsoftware.SkilletTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Skillet:
    build:
      targets:
        Skillet: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SkilletTests
    archive:
      config: Release
